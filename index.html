
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>World Quiz Challenge</title>

<style>
body{
  font-family: Arial, sans-serif;
  margin:0;
  background:#f4f7fb;
  text-align:center;
}

header{
  background:#1565c0;
  color:white;
  padding:25px 10px;
}

header h1{
  margin:0;
  font-size:30px;
}

header p{
  margin:8px 0 0;
}

.container{
  max-width:700px;
  margin:auto;
  padding:20px;
}

.category{
  display:block;
  width:100%;
  padding:15px;
  margin:10px 0;
  border:none;
  border-radius:10px;
  background:white;
  font-size:17px;
  cursor:pointer;
  box-shadow:0 2px 7px rgba(0,0,0,.12);
}

.category:hover{
  background:#e3f2fd;
}

#quiz{
  display:none;
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.12);
}

.option{
  display:block;
  width:100%;
  padding:13px;
  margin:10px 0;
  border:1px solid #ddd;
  border-radius:8px;
  background:white;
  font-size:16px;
}

.correct{
  background:#c8e6c9 !important;
}

.wrong{
  background:#ffcdd2 !important;
}

#nextBtn{
  display:none;
  padding:12px 25px;
  border:none;
  border-radius:8px;
  background:#1565c0;
  color:white;
  font-size:16px;
}

#result{
  display:none;
  background:white;
  padding:25px;
  border-radius:12px;
}

.actionBtn{
  padding:12px 20px;
  margin:7px;
  border:none;
  border-radius:8px;
  background:#1565c0;
  color:white;
  font-size:16px;
}

#error{
  color:red;
  font-weight:bold;
}
</style>
</head>

<body>

<header>
<h1>🌍 World Quiz Challenge</h1>
<p>International Knowledge & Professional Quiz</p>
</header>

<div class="container">

<div id="categoryScreen">
<h2>Choose a Category</h2>
<p id="loading">Loading categories...</p>
<p id="error"></p>
<div id="categories"></div>
</div>

<div id="quiz">

<h3 id="categoryTitle"></h3>

<p>
Question <span id="questionNumber"></span>
&nbsp; | &nbsp;
Score: <span id="score">0</span>
</p>

<h2 id="question"></h2>

<div id="options"></div>

<p id="feedback"></p>

<button id="nextBtn" onclick="nextQuestion()">
Next Question
</button>

</div>

<div id="result">

<h2>Quiz Completed!</h2>

<h3 id="finalScore"></h3>

<button class="actionBtn" onclick="playAgain()">
Play Again
</button>

<button class="actionBtn" onclick="chooseCategory()">
Choose Category
</button>

</div>

</div>

<script>

let database = {};
let currentCategory = "";
let questions = [];
let currentQuestion = 0;
let score = 0;
let answered = false;

fetch("questions.json")
.then(response => {

  if(!response.ok){
    throw new Error("questions.json not found");
  }

  return response.json();

})
.then(data => {

  database = data;

  document.getElementById("loading").style.display = "none";

  createCategories();

})
.catch(error => {

  document.getElementById("loading").style.display = "none";

  document.getElementById("error").innerText =
  "❌ Could not load question database.";

  console.error(error);

});


function createCategories(){

  const box = document.getElementById("categories");

  box.innerHTML = "";

  Object.keys(database).forEach(category => {

    const button = document.createElement("button");

    button.className = "category";

    button.innerText =
    getIcon(category) +
    " " +
    category +
    " (" +
    database[category].length +
    ")";

    button.onclick = function(){
      startQuiz(category);
    };

    box.appendChild(button);

  });

}


function getIcon(category){

  const name = category.toLowerCase();

  if(name.includes("medical")) return "🩺";
  if(name.includes("electrical")) return "⚡";
  if(name.includes("mechanical")) return "⚙️";
  if(name.includes("engineering")) return "🛠️";
  if(name.includes("computer")) return "💻";
  if(name.includes("technology")) return "💻";
  if(name.includes("physics")) return "⚛️";
  if(name.includes("chemistry")) return "🧪";
  if(name.includes("biology")) return "🧬";
  if(name.includes("math")) return "➗";
  if(name.includes("geography")) return "🌍";
  if(name.includes("history")) return "📜";
  if(name.includes("space")) return "🚀";
  if(name.includes("business")) return "💼";
  if(name.includes("sports")) return "🏆";
  if(name.includes("brain")) return "🧠";
  if(name.includes("science")) return "🔬";

  return "📚";
}


function startQuiz(category){

  currentCategory = category;

  questions = [...database[category]];

  if(questions.length === 0){

    alert("Questions will be added soon.");

    return;

  }

  questions.sort(() => Math.random() - 0.5);

  currentQuestion = 0;
  score = 0;

  document.getElementById("score").innerText = score;

  document.getElementById("categoryScreen").style.display = "none";
  document.getElementById("result").style.display = "none";
  document.getElementById("quiz").style.display = "block";

  document.getElementById("categoryTitle").innerText = category;

  showQuestion();

}


function showQuestion(){

  answered = false;

  document.getElementById("feedback").innerText = "";
  document.getElementById("nextBtn").style.display = "none";

  const q = questions[currentQuestion];

  document.getElementById("questionNumber").innerText =
  (currentQuestion + 1) + " / " + questions.length;

  document.getElementById("question").innerText = q.question;

  const optionsBox = document.getElementById("options");

  optionsBox.innerHTML = "";

  q.options.forEach(option => {

    const button = document.createElement("button");

    button.className = "option";
    button.innerText = option;

    button.onclick = function(){
      checkAnswer(button, option, q.answer);
    };

    optionsBox.appendChild(button);

  });

}


function checkAnswer(button, selected, correctAnswer){

  if(answered) return;

  answered = true;

  const buttons =
  document.querySelectorAll(".option");

  buttons.forEach(btn => {

    btn.disabled = true;

    if(btn.innerText === correctAnswer){
      btn.classList.add("correct");
    }

  });

  if(selected === correctAnswer){

    score++;

    document.getElementById("score").innerText = score;

    document.getElementById("feedback").innerText =
    "✅ Correct!";

  }else{

    button.classList.add("wrong");

    document.getElementById("feedback").innerText =
    "❌ Wrong! Correct answer: " + correctAnswer;

  }

  document.getElementById("nextBtn").style.display =
  "inline-block";

}


function nextQuestion(){

  currentQuestion++;

  if(currentQuestion < questions.length){

    showQuestion();

  }else{

    showResult();

  }

}


function showResult(){

  document.getElementById("quiz").style.display = "none";

  document.getElementById("result").style.display = "block";

  const percentage =
  Math.round((score / questions.length) * 100);

  document.getElementById("finalScore").innerText =
  "Your Score: " +
  score +
  " / " +
  questions.length +
  " (" +
  percentage +
  "%)";

}


function playAgain(){

  startQuiz(currentCategory);

}


function chooseCategory(){

  document.getElementById("result").style.display = "none";

  document.getElementById("quiz").style.display = "none";

  document.getElementById("categoryScreen").style.display =
  "block";

}

</script>

</body>
</html>
