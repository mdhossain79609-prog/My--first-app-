
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>World Quiz Challenge</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#16222A,#3A6073);
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.app{
  width:92%;
  max-width:450px;
  background:white;
  padding:25px;
  border-radius:22px;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,.3);
}

h1{margin-bottom:5px}

.subtitle{
  color:#666;
  margin-bottom:20px;
}

button{
  width:100%;
  padding:14px;
  margin:6px 0;
  border:none;
  border-radius:12px;
  font-size:16px;
  cursor:pointer;
}

.category{
  background:#edf2ff;
  color:#222;
}

.answer{
  background:#f1f1f1;
  color:#222;
}

.next{
  background:#16a34a;
  color:white;
}

.home{
  background:#2563eb;
  color:white;
}

#quizPage,#resultPage{
  display:none;
}

.top{
  display:flex;
  justify-content:space-between;
  margin-bottom:15px;
  font-weight:bold;
  color:#555;
}

#feedback{
  min-height:30px;
  font-size:18px;
  font-weight:bold;
  margin-top:10px;
}

.score{
  font-size:45px;
  font-weight:bold;
  margin:20px 0;
}

#loading{
  color:#666;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="app">

<!-- HOME -->
<div id="homePage">

<h1>🌍 World Quiz Challenge</h1>
<p class="subtitle">International Knowledge & Professional Quiz</p>

<h2>Choose a Category</h2>

<div id="loading">Loading categories...</div>

<div id="categories"></div>

</div>


<!-- QUIZ -->
<div id="quizPage">

<div class="top">
<span id="progress"></span>
<span id="topScore"></span>
</div>

<h2 id="categoryName"></h2>

<h3 id="question"></h3>

<div id="answers"></div>

<div id="feedback"></div>

<button
id="nextButton"
class="next"
onclick="nextQuestion()"
style="display:none">
Next Question ➜
</button>

<button class="home" onclick="goHome()">
🏠 Categories
</button>

</div>


<!-- RESULT -->
<div id="resultPage">

<h1>🏆 Quiz Complete!</h1>

<p>Your Score</p>

<div class="score" id="finalScore"></div>

<p id="finalMessage"></p>

<button class="next" onclick="playAgain()">
🔄 Play Again
</button>

<button class="home" onclick="goHome()">
🏠 Choose Category
</button>

</div>

</div>
