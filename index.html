<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>World Quiz Challenge</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#e0f2fe,#ede9fe,#f5f3ff);
    color:#263238;
}

/* Header */

header{
    background:linear-gradient(135deg,#4f8cff,#6c63ff);
    color:white;
    text-align:center;
    padding:22px 15px;
    box-shadow:0 3px 12px rgba(0,0,0,0.12);
}

header h1{
    margin:0;
    font-size:28px;
}

header p{
    margin:8px 0 0;
    font-size:15px;
    opacity:0.95;
}

/* Main */

.container{
    width:94%;
    max-width:800px;
    margin:25px auto;
}

/* Cards */

.screen{
    background:rgba(255,255,255,0.92);
    border-radius:18px;
    padding:22px;
    box-shadow:0 5px 20px rgba(0,0,0,0.08);
}

h2{
    text-align:center;
    margin-top:0;
    color:#34495e;
}

/* Loading */

#loading{
    text-align:center;
    padding:20px;
    color:#555;
}

/* Error */

#error{
    color:#d32f2f;
    font-weight:bold;
    text-align:center;
    margin:15px 0;
}

/* Categories */
    
#categoryScreen{
    display:none;
}
    
#categoryScreen{
    display:none;
    position:relative;
    z-index:1;
    width:100%;
    clear:both;
}

#categories{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:12px;
    position:relative;
    z-index:1;
}
    
#result{
    display:none;
}
    
#categories{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    margin-top:20px;
}

.category-btn{
    border:none;
    padding:16px 10px;
    border-radius:14px;
    background:#ffffff;
    color:#263238;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 3px 10px rgba(0,0,0,0.08);
    transition:0.2s;
}

.category-btn:hover{
    transform:translateY(-2px);
    background:#eef5ff;
}

.category-btn:active{
    transform:scale(0.98);
}

/* Quiz */

#quiz{
    display:none;
}

#categoryTitle{
    text-align:center;
    color:#4169e1;
    margin-top:0;
}

.question-info{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#f2f7ff;
    padding:12px;
    border-radius:12px;
    margin-bottom:18px;
    font-weight:bold;
}

#questionText{
    font-size:20px;
    font-weight:bold;
    line-height:1.5;
    margin-bottom:20px;
}

/* Answers */

#answers{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.answer-btn{
    width:100%;
    padding:15px;
    border:2px solid #dce6f2;
    border-radius:12px;
    background:white;
    color:#263238;
    text-align:left;
    font-size:16px;
    cursor:pointer;
    transition:0.2s;
}

.answer-btn:hover{
    background:#f2f7ff;
    border-color:#6c8cff;
}

.answer-btn.wrong{
    background:#ffe0e0;
    border-color:#e53935;
    color:#a41414;
}
    
.answer-btn.correct{
    background:#d9f8df;
    border-color:#25a244;
    color:#146c2e;
}
    
.answer-btn:disabled{
    cursor:not-allowed;
    opacity:0.85;
}

.main-header{
    position:relative;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    height:70px;
    padding:18px 55px 10px;
    background:linear-gradient(135deg,#6d4acb,#8b5cf6);
    color:white;
    border-radius:0 0 28px 28px;
    box-shadow:0 5px 15px rgba(70,40,130,0.20);
}

.header-title{
    text-align:center;
}

.new-world-logo{
    font-size:150px;
    line-height:1;
    position:relative;
    top:70px;
    z-index:2;
}

.header-title h1{
    margin:0;
    position:relative;
    top:85px;
    z-index:3;
    text-align:center;
    line-height:1.05;
}

.world-title{
    display:block;
    font-size:27px;
    font-weight:bolpx
}

.challenge-title{
    display:block;
    font-size:23px;
    font-weight:600;
    color:#ffd166;
}

.quiz-subtitle{
    margin:8px 0 0;
    font-size:13px;
    font-weight:400;
    line-height:1.35;
    text-align:center;
    color:#e8f1ff;
    position:relative;
    top:85px;
    z-index:3;
}

.menu-btn,
.settings-btn{
    position:absolute;
    top:20px;
    width:45px;
    height:45px;
    border:none;
    border-radius:50%;
    background:rgba(255,255,255,0.18);
    color:white;
    font-size:23px;
    cursor:pointer;
}

.menu-btn{
    left:15px;
}

.settings-btn{
    left:15px;
}

.menu-btn:active,
.settings-btn:active{
    transform:scale(0.94);
}
    .points-box{
    position:absolute;
    top:25px;
    right:15px;
    padding:7px 12px;
    border-radius:20px;
    background:rgba(255,255,255,0.18);
    color:white;
    font-size:16px;
    font-weight:bold;
    white-space:nowrap;
}
    /* ==============================
   MENU PANEL
   ============================== */

.menu-panel{
    position:fixed;
    top:0;
    left:-290px;
    width:270px;
    height:100vh;
    background:#DCE6F0;
    padding:25px 18px;
    z-index:9999;
    box-shadow:5px 0 20px rgba(0,0,0,0.18);
    transition:0.3s ease;
}

.menu-panel.active{
    left:0;
}

.close-menu{
    float:right;
    border:none;
    background:none;
    font-size:25px;
    color:#5B35C8;
    cursor:pointer;
}

.menu-panel h2{
    color:#5B35C8;
    margin-top:50px;
    text-align:center;
}

.menu-item{
    display:block;
    width:100%;
    margin:15px 0;
    padding:14px;
    border:none;
    border-radius:12px;
    background:white;
    color:#5B35C8;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 3px 8px rgba(0,0,0,0.08);
}
    /* ==============================
   SETTINGS PANEL
   ============================== */

.settings-panel{
    position:fixed;
    top:0;
    right:-290px;
    width:270px;
    height:100vh;
    background:#DCE6F0;
    padding:25px 18px;
    z-index:9999;
    box-shadow:-5px 0 20px rgba(0,0,0,0.18);
    transition:0.3s ease;
}

.settings-panel.active{
    right:0;
}

.close-settings{
    float:right;
    border:none;
    background:none;
    font-size:25px;
    color:#5B35C8;
    cursor:pointer;
}

.settings-panel h2{
    color:#5B35C8;
    margin-top:50px;
    text-align:center;
}

.setting-item{
    display:block;
    width:100%;
    margin:15px 0;
    padding:14px;
    border:none;
    border-radius:12px;
    background:white;
    color:#5B35C8;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}
    .main-btn{
    border:none;
    padding:16px 35px;
    border-radius:14px;
    background:#22c55e;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    margin:5px;
    box-shadow:0 5px 12px rgba(0,0,0,0.15);
    transition:0.2s;
}

.main-btn:hover{
    transform:scale(1.03);
}

.main-btn:active{
    transform:scale(0.97);
}
    
</style>
    
</head>

<body>

<header class="main-header">

    <button class="settings-btn" id="settingsBtn">⚙️</button>

    <div class="header-title">
        
        <div class="new-world-logo">🌍</div>
        
        <h1>
    <span class="world-title">World Quiz</span>
    <span class="challenge-title">Challenge</span>
</h1>
        <p class="quiz-subtitle">
    Test your knowledge from around<br>
    the world!
</p>
    </div>

    <div class="points-box" id="pointsBox">🪙 <span id="points">0</span></div>

</header>


<div class="container">
    
    <!-- MENU PANEL -->

<div id="menuPanel" class="menu-panel">
    
    <button id="closeMenu" class="close-menu">✕</button>

    <h2>☰ Menu</h2>

    <button class="menu-item" id="homeMenuBtn">
        🏠 Home
    </button>

    <button class="menu-item" id="profileMenuBtn">
        👤 Profile
    </button>

    <button class="menu-item" id="settingsMenuBtn">
        ⚙️ Settings
    </button>

</div>
    
    <!-- SETTINGS PANEL -->

<div id="settingsPanel" class="settings-panel">

    <button id="closeSettings" class="close-settings">✕</button>

    <h2>⚙️ Settings</h2>

    <button class="setting-item">
        🔊 Sound
    </button>

    <button class="setting-item">
        🌐 Language
    </button>

    <button class="setting-item">
        🔔 Notifications
    </button>

</div>
    
<!-- HOME SCREEN -->

<div id="homeScreen" class="screen">

    <button
        id="startQuizBtn"
        class="main-btn"
        style="margin-top:130px;">
        Start Quiz
    </button>

</div>
    
    <!-- CATEGORY SCREEN -->

    <div id="categoryScreen" class="screen">

        <h2>📚 Choose a Category</h2>

        <p id="loading">
            Loading categories...
        </p>

        <p id="error"></p>

        <div id="categories"></div>

    </div>


    <!-- QUIZ SCREEN -->

    <div id="quiz" class="screen">

        <h2 id="categoryTitle"></h2>

        <div class="question-info">

            <span>
                Question
                <span id="questionNumber">1</span>
            </span>

            <span>
                Score:
                <span id="score">0</span>
            </span>

        </div>


        <div id="questionText">
            Question loading...
        </div>


        <div id="answers"></div>
<button
    id="nextBtn"
    class="main-btn">
    Next Question
</button>

        <button
    id="categoryBtn"
    class="main-btn"
    style="width:100%; background:#22c55e; color:white;"
>
    Back to Categories
        </button>
        </div>

<!-- RESULT SCREEN -->

    <div id="result" class="screen">

        <h2>🎉 Quiz Complete!</h2>

        <div class="score-box">

            <div>
                Your Score
            </div>

            <div
                id="finalScore"
                class="score-number">
                0
            </div>

            <div id="resultMessage"></div>

        </div>

        <button
            class="main-btn"
            onclick="restartQuiz()">
            🔄 Try Again
        </button>

        <button
            class="main-btn"
            onclick="showCategories()">
            📚 Categories
        </button>
        
    </div>
    
    </div>

<script>

/* ==========================================
   WORLD QUIZ CHALLENGE
   ========================================== */

let quizData = {};

let currentCategory = "";

let currentQuestions = [];

let currentQuestionIndex = 0;

let score = 0;
let answered = false;


/* BACK TO CATEGORIES */

document.getElementById("categoryBtn").onclick = function(){

    document.getElementById("quiz").style.display = "none";
    document.getElementById("result").style.display = "none";
    document.getElementById("homeScreen").style.display = "none";
    document.getElementById("categoryScreen").style.display = "block";

};


/* CLOSE MENU */

document.getElementById("closeMenu").onclick = function(){

    document.getElementById("menuPanel")
        .classList.remove("active");

};
    /* SETTINGS BUTTON */

document.getElementById("settingsBtn").onclick = function(){

    document.getElementById("settingsPanel")
        .classList.add("active");

};


/* CLOSE SETTINGS */

document.getElementById("closeSettings").onclick = function(){

    document.getElementById("settingsPanel")
        .classList.remove("active");

};
    
    /* START QUIZ */

document.getElementById("startQuizBtn").onclick = function(){

    document.getElementById("homeScreen").style.display = "none";
    document.getElementById("categoryScreen").style.display = "block";

};
/* ==============================
   LOAD QUESTIONS
   ========================================== */

async function loadQuestions() {

    const loading = document.getElementById("loading");
    const error = document.getElementById("error");

    try {

        // questions.json ফাইল লোড করবে
        // Date.now() ব্যবহারে পুরোনো cached JSON নেওয়ার ঝুঁকি কমবে
        const response = await fetch(
            "./questions.json?v=" + Date.now()
        );

        if (!response.ok) {
            throw new Error(
                "HTTP Error: " + response.status
            );
        }

const data = await response.json();

        // JSON ঠিকমতো পাওয়া গেছে কি না পরীক্ষা
        if (
            !data ||
            typeof data !== "object" ||
            Array.isArray(data)
        ) {
            throw new Error(
                "questions.json format is not correct"
            );
        }

        quizData = data;

        // Loading লেখা বন্ধ
        loading.style.display = "none";
        error.innerHTML = "";

        // Category তৈরি
        createCategories();

    } catch (err) {

        loading.style.display = "none";

        error.innerHTML =
            "❌ Questions could not be loaded.<br>" +
            "Error: " + err.message;

        console.error(
            "Questions loading error:",
            err
        );
    }
}


/* ==========================================
   CREATE CATEGORIES
   ========================================== */

function createCategories(){

    const container =
        document.getElementById("categories");

    container.innerHTML = "";

    let categories = [];


    /*
       Supported JSON formats:

       1.
       {
          "Science":[...],
          "Math":[...]
       }

       2.
       {
          "categories":{
             "Science":[...],
             "Math":[...]
          }
       }
    */


    if(
        quizData.categories &&
        typeof quizData.categories === "object"
    ){

        quizData = quizData.categories;

    }


    categories =
        Object.keys(quizData);


    if(categories.length === 0){

        document.getElementById("error").innerHTML =
            "❌ কোনো Category পাওয়া যায়নি।";

        return;

    }


    categories.forEach(function(category){

        const button =
            document.createElement("button");

        button.className =
            "category-btn";

        button.textContent =
            "📘 " + category;

        button.onclick =
            function(){

                startQuiz(category);

            };

        container.appendChild(button);

    });

}


/* ==========================================
   START QUIZ
   ========================================== */

function startQuiz(category){

    currentCategory =
        category;

    currentQuestions =
        quizData[category];


    if(
        !Array.isArray(currentQuestions) ||
        currentQuestions.length === 0
    ){

        alert(
            "এই Category-তে এখনো কোনো প্রশ্ন নেই।"
        );

        return;

    }


    currentQuestionIndex = 0;

    score = 0;

    answered = false;


    document.getElementById(
        "categoryScreen"
    ).style.display = "none";


    document.getElementById(
        "result"
    ).style.display = "none";


    document.getElementById(
        "quiz"
    ).style.display = "block";


    document.getElementById(
        "categoryTitle"
    ).textContent =
        "📚 " + category;


    showQuestion();

}


/* ==========================================
   SHOW QUESTION
   ========================================== */

function showQuestion(){

    answered = false;

    const question =
        currentQuestions[currentQuestionIndex];


    document.getElementById(
        "questionNumber"
    ).textContent =
        (currentQuestionIndex + 1)
        + " / "
        + currentQuestions.length;


    document.getElementById(
        "score"
    ).textContent =
        score;


    /*
       Supports:

       {
          "question":"...",
          "options":["A","B","C","D"],
          "answer":"A"
       }

       Also supports answer as index:

       "answer":0
    */


    const questionText =
        question.question ||
        question.questionText ||
        question.q ||
        "";


    document.getElementById(
        "questionText"
    ).textContent =
        questionText;


    const answers =
        document.getElementById(
            "answers"
        );

    answers.innerHTML = "";


    let options =
        question.options ||
        question.answers ||
        question.choices ||
        [];


    options.forEach(
        function(option,index){

            const button =
                document.createElement("button");

            button.className =
                "answer-btn";

            button.textContent =
                option;


            button.onclick =
                function(){

                    checkAnswer(
                        index,
                        option,
                        question
                    );

                };


            answers.appendChild(button);

        }
    );


    document.getElementById(
        "nextBtn"
    ).style.display =
        "none";

}


/* ==========================================
   CHECK ANSWER
   ========================================== */

function checkAnswer(
    selectedIndex,
    selectedOption,
    question
){

    if(answered){
        return;
    }

    answered = true;


    let correctAnswer =
        question.answer;


    if(correctAnswer === undefined){

        correctAnswer =
            question.correctAnswer;

    }


    const buttons =
        document.querySelectorAll(
            ".answer-btn"
        );


    let correctIndex = -1;


    /* Answer as number */

    if(
        typeof correctAnswer === "number"
    ){

        correctIndex =
            correctAnswer;

    }


    /* Answer as text */

    else if(
        typeof correctAnswer === "string"
    ){

        buttons.forEach(
            function(button,index){

                if(
                    button.textContent.trim()
                    ===
                    correctAnswer.trim()
                ){

                    correctIndex =
                        index;

                }

            }
        );


        /*
           Also supports A/B/C/D
        */

        if(correctIndex === -1){

            const letter =
                correctAnswer
                .trim()
                .toUpperCase();


            if(
                letter === "A"
            ) correctIndex = 0;

            if(
                letter === "B"
            ) correctIndex = 1;

            if(
                letter === "C"
            ) correctIndex = 2;

            if(
                letter === "D"
            ) correctIndex = 3;

        }

    }


    buttons.forEach(
        function(button,index){

            button.disabled = true;


            if(index === correctIndex){

                button.classList.add(
                    "correct"
                );

            }

        }
    );


    if(
        selectedIndex === correctIndex
    ){

        score++;

    }

    else{

        if(
            buttons[selectedIndex]
        ){

            buttons[selectedIndex]
                .classList.add(
                    "wrong"
                );

        }

    }


    document.getElementById(
        "score"
    ).textContent =
        score;


    document.getElementById(
        "nextBtn"
    ).style.display =
        "block";

}


/* ==========================================
   NEXT QUESTION
   ========================================== */

document.getElementById(
    "nextBtn"
).onclick = function(){

    currentQuestionIndex++;


    if(
        currentQuestionIndex
        >=
        currentQuestions.length
    ){

        showResult();

    }

    else{

        showQuestion();

    }

};


/* ==========================================
   SHOW RESULT
   ========================================== */

function showResult(){

    document.getElementById(
        "quiz"
    ).style.display =
        "none";


    document.getElementById(
        "result"
    ).style.display =
        "block";


    const total =
        currentQuestions.length;


    document.getElementById(
        "finalScore"
    ).textContent =
        score + " / " + total;


    const percentage =
        Math.round(
            (score / total) * 100
        );


    let message = "";


    if(percentage >= 90){

        message =
            "🏆 Excellent! অসাধারণ ফলাফল!";

    }

    else if(percentage >= 70){

        message =
            "👏 Great Job! খুব ভালো!";

    }

    else if(percentage >= 50){

        message =
            "👍 Good! আরও একটু চেষ্টা করুন।";

    }

    else{

        message =
            "💪 Keep Practicing! আবার চেষ্টা করুন।";

    }


    document.getElementById(
        "resultMessage"
    ).innerHTML =
        message +
        "<br><br>" +
        "Percentage: " +
        percentage +
        "%";

}


/* ==========================================
   RESTART
   ========================================== */

function restartQuiz(){

    currentQuestionIndex = 0;

    score = 0;

    answered = false;

    document.getElementById(
        "result"
    ).style.display =
        "none";

    document.getElementById(
        "quiz"
    ).style.display =
        "block";

    showQuestion();

}


/* ==========================================
   SHOW CATEGORIES
   ========================================== */

function showCategories(){

    document.getElementById(
        "quiz"
    ).style.display =
        "none";


    document.getElementById(
        "result"
    ).style.display =
        "none";


    document.getElementById(
        "categoryScreen"
    ).style.display =
        "block";

}


/* ==========================================
   START
   ========================================== */

loadQuestions();

</script>

</body>
</html>
