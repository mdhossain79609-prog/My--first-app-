
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>World Quiz Challenge</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#16222A,#3A6073);
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.app{
  width:92%;
  max-width:450px;
  background:white;
  padding:25px;
  border-radius:22px;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,.3);
}

h1{margin-bottom:5px}

.subtitle{
  color:#666;
  margin-bottom:20px;
}

button{
  width:100%;
  padding:14px;
  margin:6px 0;
  border:none;
  border-radius:12px;
  font-size:16px;
  cursor:pointer;
}

.category{
  background:#edf2ff;
  color:#222;
}

.answer{
  background:#f1f1f1;
  color:#222;
}

.next{
  background:#16a34a;
  color:white;
}

.home{
  background:#2563eb;
  color:white;
}

#quizPage,#resultPage{
  display:none;
}

.top{
  display:flex;
  justify-content:space-between;
  margin-bottom:15px;
  font-weight:bold;
  color:#555;
}

#feedback{
  min-height:30px;
  font-size:18px;
  font-weight:bold;
  margin-top:10px;
}

.score{
  font-size:45px;
  font-weight:bold;
  margin:20px 0;
}

#loading{
  color:#666;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="app">

<!-- HOME -->
<div id="homePage">

<h1>🌍 World Quiz Challenge</h1>
<p class="subtitle">International Knowledge & Professional Quiz</p>

<h2>Choose a Category</h2>

<div id="loading">Loading categories...</div>

<div id="categories"></div>

</div>


<!-- QUIZ -->
<div id="quizPage">

<div class="top">
<span id="progress"></span>
<span id="topScore"></span>
</div>

<h2 id="categoryName"></h2>

<h3 id="question"></h3>

<div id="answers"></div>

<div id="feedback"></div>

<button
id="nextButton"
class="next"
onclick="nextQuestion()"
style="display:none">
Next Question ➜
</button>

<button class="home" onclick="goHome()">
🏠 Categories
</button>

</div>


<!-- RESULT -->
<div id="resultPage">

<h1>🏆 Quiz Complete!</h1>

<p>Your Score</p>

<div class="score" id="finalScore"></div>

<p id="finalMessage"></p>

<button class="next" onclick="playAgain()">
🔄 Play Again
</button>

<button class="home" onclick="goHome()">
🏠 Choose Category
</button>

</div>

</div>


<script>

let database = {};
let currentCategory = "";
let questions = [];
let currentQuestion = 0;
let score = 0;
let answered = false;


/* LOAD QUESTIONS.JSON */

fetch("questions.json")
.then(response => {

  if(!response.ok){
    throw new Error("Database could not be loaded.");
  }

  return response.json();

})
.then(data => {

  database = data;

  document.getElementById("loading").style.display="none";

  createCategories();

})
.catch(error => {

  document.getElementById("loading").innerHTML =
  "❌ Could not load question database.";

  console.error(error);

});


/* CREATE CATEGORY BUTTONS AUTOMATICALLY */

function createCategories(){

  const box = document.getElementById("categories");
  box.innerHTML = "";

  Object.keys(database).forEach(category => {

    const button = document.createElement("button");

    button.className = "category";

    button.innerText =
    getIcon(category) + " " + category +
    " (" + database[category].length + ")";

    button.onclick = function(){
      startQuiz(category);
    };

    box.appendChild(button);

  });

}


/* CATEGORY ICONS */

function getIcon(category){

  const name = category.toLowerCase();

  if(name.includes("medical")) return "🩺";
  if(name.includes("mechanical")) return "🔧";
  if(name.includes("electrical")) return "⚡";
  if(name.includes("engineering")) return "⚙️";
  if(name.includes("computer")) return "💻";
  if(name.includes("technology")) return "💻";
  if(name.includes("science")) return "🔬";
  if(name.includes("geography")) return "🗺️";
  if(name.includes("history")) return "📜";
  if(name.includes("space")) return "🚀";
  if(name.includes("sports")) return "⚽";
  if(name.includes("math")) return "➗";
  if(name.includes("biology")) return "🧬";
  if(name.includes("chemistry")) return "🧪";
  if(name.includes("physics")) return "⚛️";

  return "🌍";
}


/* START QUIZ */

function startQuiz(category){

  currentCategory = category;

  questions = [...database[category]];

  shuffle(questions);

  currentQuestion = 0;
  score = 0;

  document.getElementById("homePage").style.display="none";
  document.getElementById("resultPage").style.display="none";
  document.getElementById("quizPage").style.display="block";

  showQuestion();

}


/* SHOW QUESTION */

function showQuestion(){

  answered = false;

  const item = questions[currentQuestion];

  document.getElementById("categoryName").innerText =
  currentCategory;

  document.getElementById("progress").innerText =
  "Question " +
  (currentQuestion + 1) +
  "/" +
  questions.length;

  document.getElementById("topScore").innerText =
  "Score: " + score;

  document.getElementById("question").innerText =
  item.question;

  document.getElementById("feedback").innerText = "";

  document.getElementById("nextButton").style.display =
  "none";

  const answerBox =
  document.getElementById("answers");

  answerBox.innerHTML = "";

  item.options.forEach(option => {

    const button =
    document.createElement("button");

    button.className = "answer";

    button.innerText = option;

    button.onclick = function(){
      checkAnswer(option,button);
    };

    answerBox.appendChild(button);

  });

}


/* CHECK ANSWER */

function checkAnswer(selected,selectedButton){

  if(answered) return;

  answered = true;

  const item = questions[currentQuestion];

  const buttons =
  document.querySelectorAll(".answer");

  buttons.forEach(button => {

    button.disabled = true;

    if(button.innerText === item.answer){

      button.style.background="#16a34a";
      button.style.color="white";

    }

  });

  if(selected === item.answer){

    score++;

    document.getElementById("feedback").innerText =
    "✅ Correct!";

  }else{

    selectedButton.style.background="#dc2626";
    selectedButton.style.color="white";

    document.getElementById("feedback").innerText =
    "❌ Wrong! Correct answer: " + item.answer;

  }

  document.getElementById("topScore").innerText =
  "Score: " + score;

  document.getElementById("nextButton").style.display =
  "block";

}


/* NEXT */

function nextQuestion(){

  currentQuestion++;

  if(currentQuestion < questions.length){

    showQuestion();

  }else{

    showResult();

  }

}


/* RESULT */

function showResult(){

  document.getElementById("quizPage").style.display =
  "none";

  document.getElementById("resultPage").style.display =
  "block";

  document.getElementById("finalScore").innerText =
  score + " / " + questions.length;

  const percent =
  Math.round((score/questions.length)*100);

  let message = "";

  if(percent >= 80)
    message = "🌟 Excellent! " + percent + "%";

  else if(percent >= 50)
    message = "👏 Good Job! " + percent + "%";

  else
    message = "💪 Keep Learning! " + percent + "%";

  document.getElementById("finalMessage").innerText =
  message;

}


/* PLAY AGAIN */

function playAgain(){

  startQuiz(currentCategory);

}


/* HOME */

function goHome(){

  document.getElementById("quizPage").style.display =
  "none";

  document.getElementById("resultPage").style.display =
  "none";

  document.getElementById("homePage").style.display =
  "block";

  }


/* RANDOMIZE QUESTIONS */

function shuffle(array){

  for(let i=array.length-1;i>0;i--){

    const j =
    Math.floor(Math.random()*(i+1));

    [array[i],array[j]] =
    [array[j],array[i]];

  }

}

</script>

</body>
</html>
