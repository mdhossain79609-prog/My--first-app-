<script>

/* ==========================================
   WORLD QUIZ CHALLENGE
   ========================================== */

let quizData = {};

let currentCategory = "";

let currentQuestions = [];

let currentQuestionIndex = 0;

let score = 0;
let answered = false;
let currentQuizStart = 0;
let currentQuizEnd = 10;
let quizScore = 0;
let quizCompleted = false;
/* ==========================================
   COINS / POINTS SYSTEM
   ========================================== */

let coins = Number(localStorage.getItem("worldQuizCoins")) || 0;

function updateCoinsDisplay(){

    document.getElementById(
        "points"
    ).textContent = coins;

    const dollars =
        coins / 1000;

    document.getElementById(
        "dollarBalance"
    ).textContent =
        dollars.toFixed(2);

}
    

function addCoins(amount){

    coins += amount;

    localStorage.setItem(
        "worldQuizCoins",
        coins
    );

    updateCoinsDisplay();

}
    /* ==========================================
   COMPLETED QUIZ SYSTEM
   ========================================== */

function getCompletedQuizzes(){

    return JSON.parse(
        localStorage.getItem(
            "worldQuizCompletedQuizzes"
        ) || "{}"
    );

}


function saveCompletedQuiz(){

    const completed =
        getCompletedQuizzes();

    if(!completed[currentCategory]){

        completed[currentCategory] = [];

    }

    const quizNumber =
        Math.floor(
            currentQuizStart / 10
        ) + 1;


    if(
        !completed[currentCategory]
            .includes(quizNumber)
    ){

        completed[currentCategory]
            .push(quizNumber);

    }


    localStorage.setItem(
        "worldQuizCompletedQuizzes",
        JSON.stringify(completed)
    );

}

/* Load saved coins when app starts */

updateCoinsDisplay();

/* BACK TO CATEGORIES */

document.getElementById("categoryBtn").onclick = function(){

    document.getElementById("quiz").style.display = "none";
    document.getElementById("result").style.display = "none";
    document.getElementById("homeScreen").style.display = "none";
    document.getElementById("categoryScreen").style.display = "block";
createCategories();
};


/* CLOSE MENU */

document.getElementById("closeMenu").onclick = function(){

    document.getElementById("menuPanel")
        .classList.remove("active");

};
    /* SETTINGS BUTTON */

document.getElementById("settingsBtn").onclick = function(){

    document.getElementById("settingsPanel")
        .classList.add("active");

};


/* CLOSE SETTINGS */

document.getElementById("closeSettings").onclick = function(){

    document.getElementById("settingsPanel")
        .classList.remove("active");

};
    
    /* START QUIZ */

document.getElementById("startQuizBtn").onclick = function(){

    document.getElementById("homeScreen").style.display = "none";
    document.getElementById("categoryScreen").style.display = "block";

};
/* ==============================
   LOAD QUESTIONS
   ========================================== */

async function loadQuestions() {

    const loading = document.getElementById("loading");
    const error = document.getElementById("error");

    try {

        // questions.json ফাইল লোড করবে
        // Date.now() ব্যবহারে পুরোনো cached JSON নেওয়ার ঝুঁকি কমবে
        const response = await fetch(
            "./questions.json?v=" + Date.now()
        );

        if (!response.ok) {
            throw new Error(
                "HTTP Error: " + response.status
            );
        }

const data = await response.json();

        // JSON ঠিকমতো পাওয়া গেছে কি না পরীক্ষা
        if (
            !data ||
            typeof data !== "object" ||
            Array.isArray(data)
        ) {
            throw new Error(
                "questions.json format is not correct"
            );
        }

        quizData = data;

        // Loading লেখা বন্ধ
        loading.style.display = "none";
        error.innerHTML = "";

        // Category তৈরি
        createCategories();

    } catch (err) {

        loading.style.display = "none";

        error.innerHTML =
            "❌ Questions could not be loaded.<br>" +
            "Error: " + err.message;

        console.error(
            "Questions loading error:",
            err
        );
    }
}


/* ==========================================
   CREATE CATEGORIES
   ========================================== */

function createCategories(){

    const container =
        document.getElementById("categories");

    container.innerHTML = "";

    let categories = [];


    /*
       Supported JSON formats:

       1.
       {
          "Science":[...],
          "Math":[...]
       }

       2.
       {
          "categories":{
             "Science":[...],
             "Math":[...]
          }
       }
    */


    if(
        quizData.categories &&
        typeof quizData.categories === "object"
    ){

        quizData = quizData.categories;

    }


    categories =
        Object.keys(quizData);


    if(categories.length === 0){

        document.getElementById("error").innerHTML =
            "❌ কোনো Category পাওয়া যায়নি।";

        return;

    }


    categories.forEach(function(category){

        const button =
            document.createElement("button");

        button.className =
            "category-btn";
const completed =
    getCompletedQuizzes();

const completedInCategory =
    completed[category] || [];

const totalQuestions =
    quizData[category].length;

const totalQuizzes =
    Math.floor(
        totalQuestions / 10
    );

let nextQuizNumber = 1;

while(
    completedInCategory.includes(nextQuizNumber) &&
    nextQuizNumber <= totalQuizzes
){

    nextQuizNumber++;

}

if(nextQuizNumber > totalQuizzes){

    button.textContent =
        "🔴 " + category + " — Completed";

}

else{

    button.textContent =
        "📘 " + category +
        " — Quiz " +
        nextQuizNumber +
        "/" +
        totalQuizzes;

}

        button.onclick =
            function(){

                startQuiz(category);

            };

        container.appendChild(button);

    });

}


/* ==========================================
   START QUIZ
   ========================================== */

function startQuiz(category){

    currentCategory =
        category;

    currentQuestions =
        quizData[category];


    if(
        !Array.isArray(currentQuestions) ||
        currentQuestions.length === 0
    ){

        alert(
            "এই Category-তে এখনো কোনো প্রশ্ন নেই।"
        );

        return;

    }

/* Find the first Quiz that has not been completed */

const completed =
    getCompletedQuizzes();

const completedInCategory =
    completed[currentCategory] || [];
const totalQuizzes =
    Math.floor(
        currentQuestions.length / 10
    );

let nextQuizNumber = 1;


while(
    completedInCategory.includes(
        nextQuizNumber
    ) &&
    nextQuizNumber <= totalQuizzes
){

    nextQuizNumber++;

}


/* All Quizzes in this Category are completed */

if(nextQuizNumber > totalQuizzes){

    alert(
        "🔴 এই Category-এর সব Quiz ইতিমধ্যে সম্পন্ন হয়েছে।"
    );

    return;

}


/* Start first available Quiz */

currentQuizStart =
    (nextQuizNumber - 1) * 10;

currentQuizEnd =
    Math.min(
        currentQuizStart + 10,
        currentQuestions.length
    );

currentQuestionIndex =
    currentQuizStart;

quizScore = 0;

score = 0;

answered = false;

quizCompleted = false;

    document.getElementById(
        "categoryScreen"
    ).style.display = "none";


    document.getElementById(
        "result"
    ).style.display = "none";


    document.getElementById(
        "quiz"
    ).style.display = "block";


    document.getElementById(
        "categoryTitle"
    ).textContent =
        "📚 " + category;


    showQuestion();

}


/* ==========================================
   SHOW QUESTION
   ========================================== */

function showQuestion(){

    answered = false;

    const question =
        currentQuestions[currentQuestionIndex];


    document.getElementById(
        "questionNumber"
    ).textContent =
        (currentQuestionIndex + 1)
        + " / "
        + currentQuestions.length;


    document.getElementById(
        "score"
    ).textContent =
        score;


    /*
       Supports:

       {
          "question":"...",
          "options":["A","B","C","D"],
          "answer":"A"
       }

       Also supports answer as index:

       "answer":0
    */


    const questionText =
        question.question ||
        question.questionText ||
        question.q ||
        "";


    document.getElementById(
        "questionText"
    ).textContent =
        questionText;


    const answers =
        document.getElementById(
            "answers"
        );

    answers.innerHTML = "";


    let options =
        question.options ||
        question.answers ||
        question.choices ||
        [];


    options.forEach(
        function(option,index){

            const button =
                document.createElement("button");

            button.className =
                "answer-btn";

            button.textContent =
                option;


            button.onclick =
                function(){

                    checkAnswer(
                        index,
                        option,
                        question
                    );

                };


            answers.appendChild(button);

        }
    );


    document.getElementById(
        "nextBtn"
    ).style.display =
        "none";

}


/* ==========================================
   CHECK ANSWER
   ========================================== */

function checkAnswer(
    selectedIndex,
    selectedOption,
    question
){

    if(answered){
        return;
    }

    answered = true;


    let correctAnswer =
        question.answer;


    if(correctAnswer === undefined){

        correctAnswer =
            question.correctAnswer;

    }


    const buttons =
        document.querySelectorAll(
            ".answer-btn"
        );


    let correctIndex = -1;


    /* Answer as number */

    if(
        typeof correctAnswer === "number"
    ){

        correctIndex =
            correctAnswer;

    }


    /* Answer as text */

    else if(
        typeof correctAnswer === "string"
    ){

        buttons.forEach(
            function(button,index){

                if(
                    button.textContent.trim()
                    ===
                    correctAnswer.trim()
                ){

                    correctIndex =
                        index;

                }

            }
        );


        /*
           Also supports A/B/C/D
        */

        if(correctIndex === -1){

            const letter =
                correctAnswer
                .trim()
                .toUpperCase();


            if(
                letter === "A"
            ) correctIndex = 0;

            if(
                letter === "B"
            ) correctIndex = 1;

            if(
                letter === "C"
            ) correctIndex = 2;

            if(
                letter === "D"
            ) correctIndex = 3;

        }

    }


    buttons.forEach(
        function(button,index){

            button.disabled = true;


            if(index === correctIndex){

                button.classList.add(
                    "correct"
                );

            }

        }
    );


    if(
    selectedIndex === correctIndex
){

    score++;
    quizScore++;

}

    else{

        if(
            buttons[selectedIndex]
        ){

            buttons[selectedIndex]
                .classList.add(
                    "wrong"
                );

        }

    }


    document.getElementById(
        "score"
    ).textContent =
        score;


    document.getElementById(
        "nextBtn"
    ).style.display =
        "block";

}

/* ==========================================
   NEXT QUESTION
   ========================================== */

document.getElementById(
    "nextBtn"
).onclick = function(){

    currentQuestionIndex++;

    /* 10 questions = 1 Quiz */

    if(
        currentQuestionIndex
        >=
        currentQuizEnd
    ){

        showResult();

    }

    else{

        showQuestion();

    }

};


/* ==========================================
   SHOW RESULT
   ========================================== */

function showResult(){

    document.getElementById(
        "quiz"
    ).style.display =
        "none";


    document.getElementById(
        "result"
    ).style.display =
        "block";


const total =
    currentQuizEnd - currentQuizStart;


document.getElementById(
    "finalScore"
).textContent =
    quizScore + " / " + total;


const percentage =
    Math.round(
        (quizScore / total) * 100
    );


/* ==========================================
   QUIZ COIN REWARD
   10/10 = 10 Coins
   Anything less = 0 Coins
   ========================================== */

if(
    total === 10 &&
    quizScore === 10 &&
    quizCompleted === false
){

    addCoins(10);

}

quizCompleted = true;
saveCompletedQuiz();

    let message = "";


    if(percentage >= 90){

        message =
            "🏆 Excellent! অসাধারণ ফলাফল!";

    }

    else if(percentage >= 70){

        message =
            "👏 Great Job! খুব ভালো!";

    }

    else if(percentage >= 50){

        message =
            "👍 Good! আরও একটু চেষ্টা করুন।";

    }

    else{

        message =
            "💪 Keep Practicing! আবার চেষ্টা করুন।";

    }


    document.getElementById(
        "resultMessage"
    ).innerHTML =
        message +
        "<br><br>" +
        "Percentage: " +
        percentage +
        "%";

}


/* ==========================================
   CONTINUE QUIZ
   ========================================== */

function continueQuiz(){

    /* No more questions in this category */

    if(
        currentQuizEnd >= currentQuestions.length
    ){

        alert("এই Category-এর সব Quiz সম্পন্ন হয়েছে।");
        return;

    }


    /* Start the next set of 10 questions */

    currentQuizStart = currentQuizEnd;

    currentQuizEnd = Math.min(
        currentQuizStart + 10,
        currentQuestions.length
    );

    currentQuestionIndex = currentQuizStart;

    quizScore = 0;
    score = 0;
    answered = false;
    quizCompleted = false;


    document.getElementById(
        "result"
    ).style.display = "none";


    document.getElementById(
        "quiz"
    ).style.display = "block";


    showQuestion();

}


/* ==========================================
   SHOW CATEGORIES
   ========================================== */

function showCategories(){

    document.getElementById(
        "quiz"
    ).style.display =
        "none";


    document.getElementById(
        "result"
    ).style.display =
        "none";


    document.getElementById(
        "categoryScreen"
    ).style.display =
        "block";
    
    createCategories();

}


/* ==========================================
   START
   ========================================== */

loadQuestions();

</script>
