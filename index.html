
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>World Quiz Challenge</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #4b6cb7, #182848);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.app {
  width: 92%;
  max-width: 430px;
  background: white;
  padding: 25px;
  border-radius: 24px;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,.3);
}

h1 { margin-bottom: 5px; }
h2 { color: #222; }

.subtitle {
  color: #666;
  margin-bottom: 25px;
}

button {
  width: 100%;
  padding: 15px;
  margin: 7px 0;
  border: none;
  border-radius: 12px;
  font-size: 17px;
  cursor: pointer;
}

.category {
  background: #eef2ff;
  color: #222;
}

.category:hover {
  background: #dfe6ff;
}

.answer {
  background: #f1f1f1;
  color: #222;
}

.next {
  background: #4CAF50;
  color: white;
}

.home {
  background: #673AB7;
  color: white;
}

#quizPage, #resultPage {
  display: none;
}

.topbar {
  display: flex;
  justify-content: space-between;
  color: #666;
  font-weight: bold;
  margin-bottom: 15px;
}

#feedback {
  min-height: 30px;
  font-weight: bold;
  font-size: 18px;
  margin-top: 10px;
}

.scoreBig {
  font-size: 42px;
  font-weight: bold;
  color: #4CAF50;
}
</style>
</head>

<body>

<div class="app">

<!-- HOME PAGE -->
<div id="homePage">

<h1>🌍 World Quiz Challenge</h1>
<p class="subtitle">Test your knowledge. Challenge yourself!</p>

<h2>Choose a Category</h2>

<button class="category" onclick="startQuiz('world')">
🌍 World Knowledge
</button>

<button class="category" onclick="startQuiz('science')">
🔬 Science
</button>

<button class="category" onclick="startQuiz('geography')">
🗺️ Geography
</button>

<button class="category" onclick="startQuiz('technology')">
💻 Technology
</button>

<button class="category" onclick="startQuiz('sports')">
⚽ Sports
</button>

</div>


<!-- QUIZ PAGE -->
<div id="quizPage">

<div class="topbar">
<span id="progress"></span>
<span id="scoreTop"></span>
</div>

<h2 id="categoryTitle"></h2>

<h3 id="question"></h3>

<div id="answers"></div>

<div id="feedback"></div>

<button id="nextButton" class="next"
onclick="nextQuestion()" style="display:none;">
Next Question ➜
</button>

</div>


<!-- RESULT PAGE -->
<div id="resultPage">

<h1>🏆 Quiz Complete!</h1>

<p>Your Score</p>

<div class="scoreBig" id="finalScore"></div>

<p id="finalMessage"></p>

<button class="next" onclick="playAgain()">
🔄 Play Again
</button>

<button class="home" onclick="goHome()">
🏠 Choose Another Category
</button>

</div>

</div>


<script>

const quizzes = {

world: [
{
q:"Which is the largest ocean on Earth?",
options:["Atlantic Ocean","Indian Ocean","Pacific Ocean","Arctic Ocean"],
answer:2
},
{
q:"How many continents are there?",
options:["5","6","7","8"],
answer:2
},
{
q:"Which country is famous for the Eiffel Tower?",
options:["Italy","France","Spain","Germany"],
answer:1
},
{
q:"Which is the largest country in the world by area?",
options:["Canada","China","Russia","USA"],
answer:2
},
{
q:"Which planet is known as the Red Planet?",
options:["Venus","Mars","Jupiter","Mercury"],
answer:1
}
],

science: [
{
q:"What gas do humans need to breathe?",
options:["Carbon Dioxide","Oxygen","Hydrogen","Nitrogen"],
answer:1
},
{
q:"What is H2O commonly called?",
options:["Salt","Water","Oxygen","Hydrogen"],
answer:1
},
{
q:"Which organ pumps blood around the human body?",
options:["Brain","Lungs","Heart","Kidney"],
answer:2
},
{
q:"What is the center of our solar system?",
options:["Earth","Moon","Sun","Mars"],
answer:2
},
{
q:"How many legs does an insect have?",
options:["4","6","8","10"],
answer:1
}
],

geography: [
{
q:"What is the capital of Japan?",
options:["Tokyo","Seoul","Beijing","Bangkok"],
answer:0
},
{
q:"Which continent is Egypt in?",
options:["Asia","Europe","Africa","Australia"],
answer:2
},
{
q:"Which is the world's largest continent?",
options:["Africa","Asia","Europe","South America"],
answer:1
},
{
q:"Mount Everest is part of which mountain range?",
options:["Alps","Andes","Himalayas","Rockies"],
answer:2
},
{
q:"Which country has the city of Sydney?",
options:["Canada","Australia","USA","New Zealand"],
answer:1
}
],

technology: [
{
q:"What does CPU stand for?",
options:[
"Central Processing Unit",
"Computer Personal Unit",
"Central Program Utility",
"Computer Processing User"
],
answer:0
},
{
q:"Which company developed Android?",
options:["Apple","Google","Microsoft","Sony"],
answer:1
},
{
q:"What does WWW stand for?",
options:[
"World Wide Web",
"World Web Window",
"Wide World Wire",
"Web World Wide"
],
answer:0
},
{
q:"Which device is commonly used to type on a computer?",
options:["Monitor","Keyboard","Speaker","Printer"],
answer:1
},
{
q:"Which of these is a web browser?",
options:["Chrome","Excel","Photoshop","PowerPoint"],
answer:0
}
],

sports: [
{
q:"How many players does a soccer team have on the field?",
options:["9","10","11","12"],
answer:2
},
{
q:"Which sport uses a racket and a shuttlecock?",
options:["Tennis","Badminton","Cricket","Golf"],
answer:1
},
{
q:"How many rings are in the Olympic symbol?",
options:["4","5","6","7"],
answer:1
},
{
q:"Which sport uses a bat, ball and wickets?",
options:["Basketball","Cricket","Golf","Hockey"],
answer:1
},
{
q:"In which sport is Wimbledon famous?",
options:["Football","Tennis","Cricket","Swimming"],
answer:1
}
]

};


const titles = {
world:"🌍 World Knowledge",
science:"🔬 Science",
geography:"🗺️ Geography",
technology:"💻 Technology",
sports:"⚽ Sports"
};

let currentCategory = "";
let currentQuestion = 0;
let score = 0;
let answered = false;


function startQuiz(category){

currentCategory = category;
currentQuestion = 0;
score = 0;

document.getElementById("homePage").style.display="none";
document.getElementById("resultPage").style.display="none";
document.getElementById("quizPage").style.display="block";

showQuestion();
}


function showQuestion(){

answered = false;

const quiz = quizzes[currentCategory];
const item = quiz[currentQuestion];

document.getElementById("categoryTitle").innerText =
titles[currentCategory];

document.getElementById("progress").innerText =
"Question " + (currentQuestion + 1) + "/" + quiz.length;

document.getElementById("scoreTop").innerText =
"Score: " + score;

document.getElementById("question").innerText = item.q;

document.getElementById("feedback").innerText = "";

document.getElementById("nextButton").style.display="none";

const answers = document.getElementById("answers");
answers.innerHTML = "";

item.options.forEach((option,index)=>{

const button = document.createElement("button");

button.className = "answer";
button.innerText = option;

button.onclick = function(){
checkAnswer(index,button);
};

answers.appendChild(button);

});

}


function checkAnswer(index,button){

if(answered) return;

answered = true;

const item = quizzes[currentCategory][currentQuestion];

const buttons = document.querySelectorAll(".answer");

buttons.forEach((btn,i)=>{

btn.disabled = true;

if(i === item.answer){
btn.style.background = "#4CAF50";
btn.style.color = "white";
}

});

if(index === item.answer){

score++;

document.getElementById("feedback").innerText =
"✅ Correct!";

}else{

button.style.background = "#f44336";
button.style.color = "white";

document.getElementById("feedback").innerText =
"❌ Wrong!";

}

document.getElementById("scoreTop").innerText =
"Score: " + score;

document.getElementById("nextButton").style.display="block";

}


function nextQuestion(){

currentQuestion++;

if(currentQuestion < quizzes[currentCategory].length){

showQuestion();

}else{

showResult();

}

}


function showResult(){

document.getElementById("quizPage").style.display="none";
document.getElementById("resultPage").style.display="block";

const total = quizzes[currentCategory].length;

document.getElementById("finalScore").innerText =
score + " / " + total;

let message="";

if(score === total){
message="🌟 Perfect! Excellent work!";
}
else if(score >= 3){
message="👏 Great job! Keep learning!";
}
else{
message="💪 Good try! Play again and improve your score.";
}

document.getElementById("finalMessage").innerText=message;

}


function playAgain(){
startQuiz(currentCategory);
}


function goHome(){

document.getElementById("resultPage").style.display="none";
document.getElementById("quizPage").style.display="none";
document.getElementById("homePage").style.display="block";

}

</script>

</body>
</html>
