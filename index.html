
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>আমার প্রথম অ্যাপ</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#6a11cb,#2575fc);
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.app{
  width:90%;
  max-width:400px;
  background:white;
  padding:25px;
  border-radius:25px;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
}

button{
  width:100%;
  padding:15px;
  margin:7px 0;
  border:none;
  border-radius:12px;
  font-size:17px;
  cursor:pointer;
}

.learn{background:#4CAF50;color:white;}
.quiz{background:#FF9800;color:white;}
.about{background:#2196F3;color:white;}
.answer{background:#eeeeee;color:#222;}
.home{background:#673AB7;color:white;}

#quizPage{display:none;}

#result{
  font-weight:bold;
  font-size:18px;
  margin-top:12px;
}
</style>
</head>

<body>

<div class="app">

<div id="homePage">

<h1>📱 আমার প্রথম অ্যাপ</h1>
<p>স্বাগতম! নিচ থেকে একটি অপশন নির্বাচন করুন।</p>

<button class="learn"
onclick="alert('📚 শেখার অংশ শিগগিরই আসছে')">
📚 শিখুন
</button>

<button class="quiz" onclick="startQuiz()">
🎯 কুইজ খেলুন
</button>

<button class="about"
onclick="alert('এই অ্যাপটি মোবাইল দিয়ে তৈরি করা হচ্ছে।')">
ℹ️ আমাদের সম্পর্কে
</button>

</div>

<div id="quizPage">

<h2>🎯 সাধারণ জ্ঞান কুইজ</h2>

<p><b>প্রশ্ন:</b> বাংলাদেশের রাজধানীর নাম কী?</p>

<button class="answer" onclick="checkAnswer(false)">
চট্টগ্রাম
</button>

<button class="answer" onclick="checkAnswer(true)">
ঢাকা
</button>

<button class="answer" onclick="checkAnswer(false)">
রাজশাহী
</button>

<button class="answer" onclick="checkAnswer(false)">
খুলনা
</button>

<div id="result"></div>

<button class="home" onclick="goHome()">
🏠 হোমে ফিরে যান
</button>

</div>

</div>

<script>

function startQuiz(){
 document.getElementById("homePage").style.display="none";
 document.getElementById("quizPage").style.display="block";
 document.getElementById("result").innerHTML="";
}

function checkAnswer(correct){

 if(correct){
  document.getElementById("result").innerHTML=
  "✅ সঠিক উত্তর! ঢাকা।";
 }else{
  document.getElementById("result").innerHTML=
  "❌ ভুল উত্তর। আবার চেষ্টা করুন।";
 }

}

function goHome(){
 document.getElementById("quizPage").style.display="none";
 document.getElementById("homePage").style.display="block";
}

</script>

</body>
</html>
